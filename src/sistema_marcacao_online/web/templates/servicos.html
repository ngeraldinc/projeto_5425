<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bellass.pt — Marcações Online</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="hero">
        <h1>Bem-vindos ao Sistema de Marcação Online</h1>
    </header>

    <main>
        <h2>Os nossos serviços disponíveis</h2>

        <section class="servicos-grid">
            {% for id_servico, nome, descricao, preco in servicos %}
                <article class="servico-card">
                    <img
                        src="{{ url_for(
                            'static',
                            filename='images/servico' ~ loop.index ~ '.jpg'
                        ) }}"
                        alt="{{ nome }}"
                    >
                    <div class="servico-conteudo">
                        <h3>{{ nome }}</h3>
                        <p>{{ descricao }}</p>
                        <p class="preco">{{ "%.2f"|format(preco) }} €</p>
                    </div>
                </article>
            {% endfor %}
        </section>

        <a class="botao-link" href="{{ url_for('web.nova_marcacao') }}">
            Consultar horários e marcar
        </a>
    </main>
</body>
</html>
